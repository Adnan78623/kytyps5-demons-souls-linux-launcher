# Builds the AppImage (packaging/build-appimage.sh) and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# A run started by hand (Actions > AppImage > Run workflow) builds it as a downloadable artifact only.
name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: packaging/build-appimage.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: DemonsSouls-KytyPS5-Launcher-x86_64.AppImage
          path: dist/DemonsSouls-KytyPS5-Launcher-x86_64.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DemonsSouls-KytyPS5-Launcher-x86_64.AppImage \
            --title "$GITHUB_REF_NAME" --generate-notes
